<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/sidebar :: sidebar('admin')}"></div>

        <div class="col-sm-10">

        <h1>Admin panel</h1>

        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link"  th:href="@{/admin}">
                    All Users
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" th:href="@{/admin/new}">
                    Add User
                </a>
            </li>
        </ul>

        <div class="card">
            <div class="card-header">
              Add new User
            </div>
            <form th:action="${user.id == null} ? @{/admin} : @{/admin/update}"
                  th:object="${user}"
                  method="post">
                <input type="hidden"
                       th:field="*{id}">
            <div class="card-body">
                <div class="row justify-content-md-center">
                    <div class="col-md-4">
                <p>
                    <label class="form-label d-block text-center">Name:</label>
                    <input class="form-control" type="text"
                           th:field="*{name}" required>
                    <span th:if="${#fields.hasErrors('name')}"
                          th:errors="*{name}"></span>
                </p>

                <p>
                    <label class="form-label d-block text-center">Surname:</label>
                    <input class="form-control" type="text"
                           th:field="*{surname}"
                           required>
                    <span th:if="${#fields.hasErrors('surname')}"
                          th:errors="*{surname}"></span>
                </p>

                <p>
                    <label class="form-label d-block text-center">Email:</label>
                    <input class="form-control" type="email"
                           th:field="*{email}"
                           required>
                    <span th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}"></span>
                </p>

                <p>
                    <label class="form-label d-block text-center">Username:</label>
                    <input class="form-control" type="text"
                           th:field="*{username}"
                           required>
                    <span th:if="${#fields.hasErrors('username')}"
                          th:errors="*{username}"></span>
                </p>

                <p th:if="${user.id == null}">
                    <label class="form-label d-block text-center">Password:</label>
                    <input class="form-control" type="password"
                           th:field="*{password}"
                           required>
                </p>

                <p th:if="${user.id != null}">
                    <label class="form-label d-block text-center">New password:</label>
                    <input class="form-control" type="password"
                           name="newPassword">
                    <small>Оставь пустым, чтобы не менять пароль</small>
                </p>

                <p>
                    <label class="form-label d-block text-center">Roles:</label>

                    <select class="form-select" th:field="*{roles}" multiple required>
                        <option th:each="role : ${roles}"
                                th:value="${role.id}"
                                th:text="${role.name}">
                        </option>
                    </select>
                </p>
                        <div class="text-center">
                            <button type="submit" class="btn btn-success">Add New User</button>
                        </div>

            </div>
            </div>
                </div>
            </form>
        </div>
    </div>
    </div>
</div>
</body>
</html>
