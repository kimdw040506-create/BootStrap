<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
          crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/sidebar :: sidebar('admin')}"></div>

        <div class="col-sm-10">
            <h1>Admin panel</h1>

            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/admin}">
                        All Users
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/new}">
                        Add User
                    </a>
                </li>
            </ul>

    <table class="table table-striped table-hover border-top">
        <thead>
            <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Surname</th>
        <th>Email</th>
        <th>Username</th>
        <th>Role</th>
        <th>Edit</th>
        <th>Delete</th>
            </tr>
    </thead>

    <tbody>

    <tr th:each="user : ${users}">

        <td th:text="${user.id}"></td>

        <td th:text="${user.name}"></td>

        <td th:text="${user.surname}"></td>

        <td th:text="${user.email}"></td>

        <td th:text="${user.username}"></td>

        <td>
    <span th:each="role, status : ${user.roles}">
        <span th:text="${role.name}"></span>
        <span th:if="${!status.last}">, </span>
    </span>
        </td>

        <td>
            <button type="button"
                    class="btn btn-info btn-sm"
                    data-bs-toggle="modal"
                    th:attr="data-bs-target=|#editModal-${user.id}|">
                Edit
            </button>
        </td>

        <td>
            <button type="button"
                    class="btn btn-danger btn-sm"
                    data-bs-toggle="modal"
                    th:attr="data-bs-target=|#deleteModal-${user.id}|">
                Delete
            </button>
        </td>
    </tr>

    </tbody>

</table>
            <th:block th:each="user : ${users}">
                <div class="modal fade"
                     th:id="|editModal-${user.id}|"
                     tabindex="-1"
                     th:attr="aria-labelledby=|editModalLabel-${user.id}|"
                     aria-hidden="true">

                    <div class="modal-dialog">
                        <div class="modal-content">

                            <form th:action="@{/admin/update}"
                                  method="post">

                                <input type="hidden"
                                       name="id"
                                       th:value="${user.id}">

                            <div class="modal-header">
                                <h5 class="modal-title"
                                    th:id="|editModalLabel-${user.id}|">
                                    Edit user
                                </h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal"
                                        aria-label="Close">
                                </button>
                            </div>

                            <div class="modal-body">
                                <div class="mb-3">

                                    <label class="form-label">
                                        Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           name="name"
                                           th:value="${editingUserId == user.id ? editingUser.name : user.name}"
                                           required>

                                    <div th:if="${editingUserId == user.id}">

                                        <div th:each="error : ${fieldErrors}"
                                             th:if="${error.field == 'name'}"
                                             class="invalid-feedback d-block"
                                             th:text="${error.defaultMessage}">
                                        </div>

                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Surname</label>

                                    <input type="text"
                                           class="form-control"
                                           name="surname"
                                           th:value="${editingUserId == user.id ? editingUser.surname : user.surname}"
                                           required>

                                    <div th:if="${editingUserId == user.id}">
                                        <div th:each="error : ${fieldErrors}"
                                             th:if="${error.field == 'surname'}"
                                             class="invalid-feedback d-block"
                                             th:text="${error.defaultMessage}">
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Username</label>

                                    <input type="text"
                                           class="form-control"
                                           name="username"
                                           th:value="${editingUserId == user.id ? editingUser.username : user.username}"
                                           required>

                                    <div th:if="${editingUserId == user.id}">
                                        <div th:each="error : ${fieldErrors}"
                                             th:if="${error.field == 'username'}"
                                             class="invalid-feedback d-block"
                                             th:text="${error.defaultMessage}">
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           name="email"
                                           th:value="${editingUserId == user.id ? editingUser.email : user.email}"
                                           required>

                                    <div th:if="${editingUserId == user.id}">

                                        <div th:each="error : ${fieldErrors}"
                                             th:if="${error.field == 'email'}"
                                             class="invalid-feedback d-block"
                                             th:text="${error.defaultMessage}">
                                        </div>

                                    </div>
                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Roles
                                    </label>

                                    <select class="form-select"
                                            name="roles"
                                            multiple
                                            size="2"
                                            required>

                                        <option th:each="role : ${roles}"
                                                th:value="${role.id}"
                                                th:text="${role.name}"
                                                th:selected="${user.roles.![id].contains(role.id)}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="modal-footer">
                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    Close
                                </button>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Edit
                                </button>
                            </div>
                            </form>
                        </div>
                    </div>
                </div>
            </th:block>

            <th:block th:each="user : ${users}">
                <div class="modal fade"
                     th:id="|deleteModal-${user.id}|"
                     tabindex="-1"
                     th:attr="aria-labelledby=|deleteModalLabel-${user.id}|"
                     aria-hidden="true">

                    <div class="modal-dialog">
                        <div class="modal-content">

                            <form th:action="@{/admin/delete/{id}(id=${user.id})}"
                                  method="post">

                                <input type="hidden"
                                       name="id"
                                       th:value="${user.id}">

                                <div class="modal-header">
                                    <h5 class="modal-title"
                                        th:id="|deleteModalLabel-${user.id}|">
                                        Delete user
                                    </h5>

                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal"
                                            aria-label="Close">
                                    </button>
                                </div>

                                <div class="modal-body">
                                    <div class="mb-3">

                                        <label class="form-label">
                                            Name
                                        </label>

                                        <input type="text"
                                               class="form-control"
                                               name="name"
                                               th:value="${user.name}"
                                               readonly>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Surname</label>

                                        <input type="text"
                                               class="form-control"
                                               name="surname"
                                               th:value="${user.surname}"
                                               readonly>
                                    </div>

                                    <div class="mb-3">

                                        <label class="form-label">
                                            Email
                                        </label>
                                        <input type="email"
                                               class="form-control"
                                               name="email"
                                               th:value="${user.email}"
                                               readonly>
                                    </div>

                                    <div class="mb-3">

                                        <label class="form-label">
                                            Username
                                        </label>
                                        <input type="text"
                                               class="form-control"
                                               name="username"
                                               th:value="${user.username}"
                                               readonly>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">New password</label>

                                        <input type="password"
                                               class="form-control"
                                               name="newPassword">

                                        <div class="form-text">
                                            Leave empty to keep the current password.
                                        </div>
                                    </div>

                                    <div class="mb-3">

                                        <label class="form-label">
                                            Roles
                                        </label>

                                        <select class="form-select"
                                                name="roles"
                                                multiple
                                                size="2"
                                                disabled>

                                            <option th:each="role : ${roles}"
                                                    th:value="${role.id}"
                                                    th:text="${role.name}">
                                            </option>
                                        </select>
                                    </div>
                                </div>

                                <div class="modal-footer">
                                    <button type="button"
                                            class="btn btn-secondary"
                                            data-bs-dismiss="modal">
                                        Close
                                    </button>

                                    <button type="submit"
                                            class="btn btn-danger">
                                        Delete
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>

<script th:if="${editingUserId != null}" th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const modalElement = document.getElementById(
            'editModal-' + /*[[${editingUserId}]]*/ ''
        );

        if (modalElement) {
            bootstrap.Modal.getOrCreateInstance(modalElement).show();
        }
    });
</script>
</body>
</html>
